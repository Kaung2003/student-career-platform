# Local Postgres for development and tests:  docker compose up -d
# Then use DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/career_dev
#      and TEST_DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/career_test
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: career_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/scripts/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro

volumes:
  pgdata:
