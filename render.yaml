# Render Blueprint: deploys the Express API (backend/). The database is hosted on Neon, not Render.
# In Render: New → Blueprint → select this repo. You'll be prompted for the secret values.

services:
  - type: web
    name: student-career-platform-backend
    runtime: node
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build && npm run db:migrate && npm run db:seed
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Your Neon connection string.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Your Netlify URL, e.g. https://your-site.netlify.app (comma-separate multiple origins).
      - key: CORS_ORIGIN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: APP_URL
        value: https://student-career-platform.netlify.app
      # Sign-up confirmation and password-reset emails. Brevo works on the free plan (SMTP is blocked there).
      - key: BREVO_API_KEY
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # "Sign in with Google" OAuth client ID.
      - key: GOOGLE_CLIENT_ID
        sync: false
      # Comma-separated emails that are promoted to admin when they log in.
      - key: ADMIN_EMAILS
        sync: false
      # Optional: error alerts from https://sentry.io.
      - key: SENTRY_DSN
        sync: false
      # Optional: Cloudflare R2 storage for resume/transcript/image uploads.
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
