# Netlify deploys the React frontend (frontend/) as a static site.
# API calls to /api/* are proxied to the Render backend, so the browser
# only ever talks to one origin (no CORS setup needed).

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Proxy API requests to the backend on Render.
# If Render gives your service a different URL, update it here.
[[redirects]]
  from = "/api/*"
  to = "https://student-career-platform-backend.onrender.com/api/:splat"
  status = 200
  force = true

# Single-page app fallback so client-side routes (/dashboard, /p/:slug, ...) work on refresh.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Vite fingerprints asset filenames, so they can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
